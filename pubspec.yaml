name: prepai
description: "AI-Powered Interview Preparation App - PrepAI"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.7.0

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # AI - Gemini
  google_generative_ai: ^0.4.6

  # File handling
  file_picker: ^8.1.7
  path_provider: ^2.1.4

  # Environment variables
  flutter_dotenv: ^5.2.1

  # Charts
  fl_chart: ^0.69.0

  # Fonts & UI
  google_fonts: ^6.2.1

  # Animations
  lottie: ^3.1.3

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  shared_preferences: ^2.3.3

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
